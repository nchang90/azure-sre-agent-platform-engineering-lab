name: Destroy SRE Agent Lab

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options:
          - sbox
          - demo
          - dev
        default: sbox
      destroy:
        description: "tf_destroy"
        required: true
        type: boolean
        default: false
  schedule:
    - cron: "0 20 * * *"
      timezone: "Europe/London"

permissions:
  contents: read
  id-token: write

concurrency:
  group: sre-agent-destroy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  destroy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(github.event_name == 'schedule' && '["sbox"]' || format('["{0}"]', inputs.environment)) }}
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Validate confirmation input
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.destroy }}" != "true" ]; then
            echo "Destroy not confirmed. Exiting."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Azure CLI login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        run: terraform -chdir=infra/terraform init -backend-config=backend/${{ matrix.environment }}.backend.tfvars

      - name: Terraform destroy
        env:
          TFVARS_FILE: environments/${{ matrix.environment }}.tfvars
        run: |
          destroy_log=$(mktemp)
          trap 'rm -f "$destroy_log"' EXIT

          if terraform -chdir=infra/terraform destroy -auto-approve -refresh=false -var-file="$TFVARS_FILE" 2>&1 | tee "$destroy_log"; then
            exit 0
          fi

          if ! grep -q 'Cannot delete data connector .* because agent is in Failed state' "$destroy_log"; then
            exit 1
          fi

          # Azure blocks connector deletion for Failed agents; delete the parent first.
          agent_id=$(terraform -chdir=infra/terraform show -json | jq -er '
            .values.root_module.resources[]?
            | select(.address == "azapi_resource.sre_agent[0]")
            | .values.id // empty
          ')
          az resource delete --ids "$agent_id" --api-version 2025-05-01-preview
          az resource wait --ids "$agent_id" --api-version 2025-05-01-preview --deleted --interval 10 --timeout 1800

          # Keep state intact so Terraform reconciles the deleted agent and connectors.
          terraform -chdir=infra/terraform destroy -auto-approve -refresh=false -var-file="$TFVARS_FILE"
