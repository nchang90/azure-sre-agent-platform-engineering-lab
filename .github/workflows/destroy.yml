name: Destroy SRE Agent Lab

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options:
          - sbox
          - demo
          - dev
        default: sbox
      destroy:
        description: "tf_destroy"
        required: true
        type: boolean
        default: false
  schedule:
    - cron: "0 20 * * *"
      timezone: "Europe/London"

permissions:
  contents: read
  id-token: write

concurrency:
  group: sre-agent-destroy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  destroy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(github.event_name == 'schedule' && '["sbox"]' || format('["{0}"]', inputs.environment)) }}
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Validate confirmation input
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.destroy }}" != "true" ]; then
            echo "Destroy not confirmed. Exiting."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Azure CLI login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        run: terraform -chdir=infra/terraform init -backend-config=backend/${{ matrix.environment }}.backend.tfvars

      - name: Terraform destroy
        env:
          TF_ENVIRONMENT: ${{ matrix.environment }}
        run: |
          set -o pipefail
          output="$(mktemp)"
          trap 'rm -f "$output"' EXIT

          for attempt in 1 2 3; do
            if terraform -chdir=infra/terraform destroy -no-color -auto-approve -refresh=false \
              -var-file="environments/${TF_ENVIRONMENT}.tfvars" 2>&1 | tee "$output"; then
              exit 0
            else
              exit_code=${PIPESTATUS[0]}
            fi

            if [[ "$attempt" -eq 3 ]] || ! grep -Eq \
              "Failed to delete [0-9]+ disk image\(s\) from sandbox group" "$output"; then
              exit "$exit_code"
            fi

            echo "::warning::SRE Agent sandbox disk-image cleanup failed; retrying destroy in 60 seconds (attempt $((attempt + 1))/3)."
            sleep 60
          done
