name: Destroy SRE Agent Lab

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options:
          - sbox
        default: sbox
      destroy:
        description: "tf_destroy"
        required: true
        type: boolean
        default: false
  schedule:
    - cron: "0 20 * * *"
      timezone: "Europe/London"

permissions:
  contents: read
  id-token: write

concurrency:
  group: sre-agent-destroy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  destroy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(github.event_name == 'schedule' && '["demo","sbox"]' || format('["{0}"]', inputs.environment)) }}
    env:
      TF_VAR_service_now_password: ${{ secrets.SERVICENOW_PASSWORD }}

    steps:
      - name: Validate confirmation input
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.destroy }}" != "true" ]; then
            echo "Destroy not confirmed. Exiting."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure CLI login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        shell: bash
        run: |
          set -euo pipefail

          set +e
          INIT_OUTPUT="$(terraform -chdir=infra/terraform init -backend-config=backend/${{ matrix.environment }}.backend.tfvars 2>&1)"
          INIT_EXIT=$?
          set -e
          echo "$INIT_OUTPUT"

          if [[ $INIT_EXIT -ne 0 ]]; then
            if echo "$INIT_OUTPUT" | grep -qiE "Failed to install provider|failed to retrieve cryptographic signature|500 Internal Server Error returned from github.com"; then
              echo "Terraform init hit transient provider download issue; retrying once..."
              sleep 10
              terraform -chdir=infra/terraform init -backend-config=backend/${{ matrix.environment }}.backend.tfvars
            else
              exit $INIT_EXIT
            fi
          fi

      - name: Terraform destroy
        run: terraform -chdir=infra/terraform destroy -auto-approve -refresh=false -var-file=environments/${{ matrix.environment }}.tfvars
