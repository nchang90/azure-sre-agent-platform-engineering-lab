name: Destroy SRE Agent Lab

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options:
          - sbox
          - demo
          - dev
        default: sbox
      destroy:
        description: "tf_destroy"
        required: true
        type: boolean
        default: false
  schedule:
    - cron: "0 20 * * *"
      timezone: "Europe/London"

permissions:
  contents: read
  id-token: write

concurrency:
  group: sre-agent-destroy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  destroy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(github.event_name == 'schedule' && '["demo","sbox"]' || format('["{0}"]', inputs.environment)) }}
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Validate confirmation input
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.destroy }}" != "true" ]; then
            echo "Destroy not confirmed. Exiting."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Azure CLI login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        run: |
          set +e
          output="$(terraform -chdir=infra/terraform init -backend-config=backend/${{ matrix.environment }}.backend.tfvars 2>&1)"
          exit_code=$?
          set -e
          echo "$output"

          if [ "$exit_code" -eq 0 ]; then
            exit 0
          fi

          if grep -Fqi "504 Gateway Timeout returned from github.com" <<<"$output"; then
            echo "Terraform init hit a transient provider download timeout; retrying once..."
            sleep 10
            terraform -chdir=infra/terraform init -backend-config=backend/${{ matrix.environment }}.backend.tfvars
          else
            exit "$exit_code"
          fi

      - name: Terraform destroy
        run: terraform -chdir=infra/terraform destroy -auto-approve -refresh=false -var-file=environments/${{ matrix.environment }}.tfvars
