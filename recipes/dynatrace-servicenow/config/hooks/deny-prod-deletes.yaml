metadata:
  name: review-prod-deletes
spec:
  eventType: PreToolUse
  hook:
    type: prompt
    prompt: >-
      If a write command deletes or removes a resource whose name or resource id contains
      'prod' or 'prd', require explicit human approval before proceeding.
    matcher: ^RunAzCliWriteCommands$
  permissionDecision: ask
  enabled: true
