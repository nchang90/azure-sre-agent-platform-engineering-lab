metadata:
  name: aks-incidents
spec:
  name: S3 Checkout API Incident Response
  incidentPlatform: ServiceNow
  isEnabled: true
  priorities:
  - "1"
  - "2"
  # Matches high/urgent AKS incidents broadly, including checkout-api service
  # routing failures, crashloop/restart failures, failed or pending pods, and
  # node pressure signals.
  titleContains: AKS
  handlingAgent: aks-triage-agent
  agentMode: autonomous
  deepInvestigationEnabled: true
  maxAutomatedInvestigationAttempts: 3