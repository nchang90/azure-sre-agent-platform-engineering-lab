# S2 runs in Autonomous mode with High access, so deployment-mutating actions are
# the sharpest edge in the lab. This hook gates them behind explicit approval.
# Modeled on labs/deployment-compliance/hooks/deployment-compliance-approval.yaml
# from microsoft/sre-agent, expressed in this recipe's PreToolUse dialect.
metadata:
  name: s2-require-approval-for-deployment-changes
spec:
  eventType: PreToolUse
  hook:
    type: prompt
    prompt: >-
      Require human approval for deployment changes, including Container App
      updates/revisions/traffic, App Service config/slots and workflow re-runs.
      Exception: if rg-sre-lab-sbox/orders-api-* has CHAOS_MODE=crash and
      CHAOS_ENABLED=true, allow only az webapp config appsettings set targeting
      that app with the sole setting CHAOS_ENABLED=false. No other setting,
      command or resource qualifies. State the command and target when asking
      for approval.
    matcher: ^(RunAzCliWriteCommands|deploy_.*|rollback_.*)$
  permissionDecision: allow
  enabled: true
