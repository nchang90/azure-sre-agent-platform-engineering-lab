# Requires human approval before the agent restarts or scales a resource.
# Matchers cover this lab's write tool (RunAzCliWriteCommands) as well as the
# verb-prefixed tool names used by the upstream template recipe.
metadata:
  name: require-approval-for-restarts
spec:
  eventType: PreToolUse
  hook:
    type: prompt
    prompt: >-
      Require human approval to restart, scale or recycle a resource. The only
      exception is the implicit restart when setting solely CHAOS_ENABLED=false
      on rg-sre-lab-sbox/orders-api-* after confirming CHAOS_MODE=crash and
      CHAOS_ENABLED=true. Explicit restarts still need approval. State the
      command and target when asking for approval.
    matcher: ^(RunAzCliWriteCommands|restart_.*|scale_.*)$
  permissionDecision: allow
  enabled: true
