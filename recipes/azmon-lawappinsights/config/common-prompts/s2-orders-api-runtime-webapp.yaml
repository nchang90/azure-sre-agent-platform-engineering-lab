# App Service guidance selected dynamically for an S2 webapp deployment.
metadata:
  name: s2-orders-api-runtime
spec:
  prompt: |
    S2 orders-api runs on Azure App Service, not Container Apps. Investigate the
    alert using App Service metrics, startup logs, app settings and change history.
    A crashed worker emits no new Application Insights request traces; other
    /api/orders-only 5xx incidents can still have a healthy /health endpoint.

    Confirm root cause before acting. If rg-sre-lab-sbox/orders-api-* has
    CHAOS_MODE=crash and CHAOS_ENABLED=true, restore only CHAOS_ENABLED=false.
    Do not restart or change other settings. All other deployment writes need
    approval. Verify /health, / and /api/orders, then reconcile Terraform's
    enable_s2_chaos=false toggle and report evidence, impact and outcome.
