# Scenario-scoped guidance for S3. Replaces custom-instructions/s3.txt.
metadata:
  name: s3-aks-incident
spec:
  prompt: 'For S3 high-severity AKS incidents, start with aks-triage-agent after the

    ServiceNow workflow invokes the Azure SRE Agent HTTP trigger.

    Preserve the same

    incident conversation context through this handoff chain:


    aks-triage-agent -> incident-summary-agent -> incident-comms-agent


    Each specialist must add only its assigned output, preserve prior evidence, and

    avoid claiming that remediation was executed. The final agent must return an

    operator-ready investigation result suitable for the originating ServiceNow

    incident or callback workflow, then return control to the main agent.

    '
